# Dolly changes the instruction data and the number of training epochs in the Lamini protocol.
question: Does matched one-epoch Dolly-15K adaptation yield a positive MIMIR GitHub witness audit in each family?
bases:
  pythia:
    model: EleutherAI/pythia-1.4b
    revision: fedc38a16eea3bd36a96b906d78d11d2ce18ed79
    tokenizer_class: GPTNeoXTokenizerFast
    lora_module_suffixes:
    - attention.dense
    - mlp.dense_4h_to_h
    expected_modules: 48
    trainable_parameters: 5505024
  biogpt:
    model: microsoft/BioGPT-Large
    revision: c6a5136a91c5e3150d9f05ab9d33927a3210a22e
    tokenizer_class: BioGptTokenizer
    lora_module_suffixes:
    - self_attn.out_proj
    - fc2
    expected_modules: 96
    trainable_parameters: 8601600
training_data:
  dataset: databricks/databricks-dolly-15k
  revision: bdd27f4d94b9c1f951818a7da7fd7aeea5dbff1a
  config: default
  train:
    split: train
    rows: 15011
  eval:
    split: train
    rows: 15011
    purpose: in-sample adaptation measurement
  fields:
  - instruction
  - context
  - response
  raw_fields: preserve whitespace
  prefix: 'Question: {question}

    Answer:'
  completion: One leading ASCII space followed by the original response.
  input: Encode prefix and response separately with the native tokenizer. Apply the native sequence prefix and append
    one supervised native EOS.
  labels: Mask native prefix, prompt and all padding with -100. Supervise the answer and its final EOS, including
    EOS at the empty-answer row.
  max_tokens: 512
  right_pad_to_multiple_of: 8
  packing: false
  verify_coverage: Use every original release row index once, including the final partial group. No held-out Dolly
    split is defined.
  question: instruction plus a newline and the original context when context is nonempty
  overflow: Preserve the structural Question/Answer cues and final EOS. Prioritize the instruction and response
    over optional context. If necessary, truncate the response on the right while retaining at least one real response
    token. If the instruction itself exhausts the budget, keep its longest feasible prefix and reserve at least
    one real response token. Fit any available leading context into remaining space.
  token_counts_file: Read <model>_preflight.json from the input directory and verify its measured input and target
    totals before training.
fine_tuning:
  method: Causal LM, LoRA on every layer's attention output and feed-forward down projection.
  rank: 16
  alpha: 32
  adapter_dropout: 0.05
  trainable_bias: false
  init: Kaiming-uniform A and zero B. Freeze all base parameters including embeddings and LM head.
  device: cuda:0
  quantization: none
  frozen_base_dtype: bfloat16
  adapter_and_optimizer_state_dtype: float32
  compute: bfloat16_autocast
  backbone_dropout: 0.0
  use_cache: false
  gradient_checkpointing: non_reentrant
  torch_seed: 42
  row_order: Use numpy.random.default_rng(42).permutation(15011), shared by both models.
  epochs: 1
  microbatch: 4
  gradient_accumulation: 4
  effective_batch: 16 examples except the final group of 3 examples.
  optimizer_updates: 939
  loss: Sum causal answer/EOS cross-entropies across each accumulation group and divide by that group's actual number
    of supervised tokens.
  optimizer: AdamW
  lr: 0.0002
  betas:
  - 0.9
  - 0.999
  epsilon: 1.0e-08
  weight_decay: 0.0
  clip_gradient_norm: 1.0
  scheduler: Linear warmup for 12 updates, then linear decay to zero after 939 updates.
  checkpoint: final_epoch_1
  outputs:
  - adapter_weights
  - adapter_config
  - effective_train_config
  - row_order
  - training_loss_trace
  - seed
  - library_versions
  - peak_memory
  - elapsed_time
downstream_evaluation:
  checkpoint_choice: fixed_in_advance
  stages:
  - pretrained
  - final_adapted
  sets:
  - full_official_train_15011
  metrics: Token-weighted response/EOS NLL and exp(NLL) in evaluation mode on the complete Dolly training split.
    Report the within-model change as in-sample fit.
witness_audit:
  inputs: data/processed/mimir_github
  construction_file: train.jsonl
  evaluation_file: test.jsonl
  construction_per_source: 500
  eval_per_source: 200
  preprocessing: Use the exact saved seed-0 ngram_13_0.2 input files, 32-word snippets, identical row labels and
    order.
  trained_checkpoints: For each new adapter merge its update into a fresh copy of the pinned model weights in FP32
    and export FP16. Check zero-delta export against the FP16 base on a fixed construction batch. Keep adapter artifacts.
  score: Use the same repository token-logprob extractor on native tokenizers, no fallback, FP16, no quantization,
    batch 4, max length 512. Both scores from one forward pass, padding excluded, causal one-token shift.
  primary_score: MIN-K20, average the lowest max(1,ceil(0.20*n)) token log probabilities.
  secondary_score: Mean log probability of all scored tokens.
  threshold_fit: 'On each checkpoint and score separately: 6-decimal stored scores, 2,001 ascending equally spaced
    thresholds from construction min to max, maximize balanced accuracy, take first tie. Predict member when score
    >= threshold.'
  advantage: Signed held-out member-source acceptance minus nonmember-source acceptance. Also report absolute magnitude,
    raw acceptance counts, fitted score thresholds and AUC.
  positive_decision: Strict signed advantage > sqrt(log(2*K/alpha)/200), as in the linked Q1 positive-direction
    analysis.
  alpha: 0.05
  individual_cutoff: 0.13581015157406195
  primary_family: 'K=2: new Pythia-Dolly and BioGPT-Dolly, MIN-K20 only.'
  secondary_family: 'Separate exploratory K=2: same two new models, mean log probability. No joint 5% claim over
    both score families.'
  adjusted_cutoff: 0.14802071873007983
  prior_checkpoints: Pretrained baselines and historical herMaster are descriptive and excluded from the two prespecified
    families.
  shuffled_control: For each checkpoint reset random.Random(42), shuffle the construction labels first and evaluation
    labels second using the same generator, preserve row scores and class counts. Refit and evaluate with those
    shuffled labels, using the same permutations for both scores and all checkpoints. Report every resulting gap.
  descriptive_changes: Show delta_adapted minus delta_base within each model and delta_Pythia_adapted minus delta_BioGPT_adapted
    for each score. Bootstrap 200 rows with replacement per source separately, share row indices across all four
    models and both scores, keep fitted thresholds frozen, 10,000 replicates and NumPy default_rng(3324). Report
    conditional percentile 95% intervals.
